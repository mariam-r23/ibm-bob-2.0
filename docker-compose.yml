version: '3.8'

# Phase 1: monolith + graph-service running side by side so the dashboard
# can hit a real backend. extracted-services/payments is added here in
# Phase 2 once the carve-out engine has written it.
services:
  monolith:
    build:
      context: ./monolith
    ports:
      - '4000:4000'
    environment:
      - PORT=4000

  graph-service:
    build:
      context: .
      dockerfile: graph-service/Dockerfile
    ports:
      - '4100:4100'
    environment:
      - PORT=4100
    depends_on:
      - monolith
