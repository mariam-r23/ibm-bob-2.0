version: '3.8'

# Phase 2: monolith + graph-service + extracted payments microservice.
# The monolith's /users/:id/charge route now delegates to payments-service
# over HTTP (rewritten by MonoSplitter AI carve-out engine).
services:
  payments-service:
    build:
      context: ./extracted-services/payments
    ports:
      - '4200:4200'
    environment:
      - PORT=4200

  monolith:
    build:
      context: ./monolith
    ports:
      - '4000:4000'
    environment:
      - PORT=4000
      - PAYMENTS_SERVICE_URL=http://payments-service:4200
    depends_on:
      - payments-service

  graph-service:
    build:
      context: .
      dockerfile: graph-service/Dockerfile
    ports:
      - '4100:4100'
    environment:
      - PORT=4100
    depends_on:
      - monolith
